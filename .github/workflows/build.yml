name: Build Site

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Site
        run: npm run astro check

      - name: Build Site
        run: npm run astro build
